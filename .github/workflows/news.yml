name: Haber botu

on:
  schedule:
    - cron: "7,37 * * * *"   # 30 dakikada bir
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Haberleri topla
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/news_bot.py

      - name: Kaydet
        run: |
          git add data/news.json
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Haberler güncellendi"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
